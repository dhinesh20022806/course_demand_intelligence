services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - 3000:3000
    env_file: ./.env
    volumes:
      - ./:/app
      - /app/node_modules

  postgres_db:
    image: postgres:18-alpine
    ports:
      - 5432:5432
    env_file: ./.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - 1025:1025
      - 8025:8025
    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:
  postgres_data:
